<!doctype html>
<html lang="en">
    <head>
        <title>Marlboro High School Calendar</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>

    <body>

            <!-- Nav tabs -->
           <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="Clubs.html">Clubs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="Guidance.html">Guidance</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="Calendar.html">Calendar</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
    <main>
      <div class="container py-5" id="calendar-app">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h1 class="mb-1">Marlboro High School</h1>
            <p class="text-muted mb-0">Official events & academic calendar</p>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <button id="todayBtn" class="btn btn-outline-secondary">Today</button>
            <div class="calendar-nav btn-group" role="group" aria-label="Month navigation">
              <button id="prevBtn" class="btn btn-primary">◀</button>
              <button id="nextBtn" class="btn btn-primary">▶</button>
            </div>
          </div>
        </div>

        <div class="calendar-shell row g-4">
          <div class="col-lg-8">
            <div class="card calendar-card">
              <div class="card-header calendar-header">
                <div class="d-flex align-items-center justify-content-between">
                  <h2 class="mb-0">Calendar — <span id="yearLabel">2026</span></h2>
                  <div class="text-muted small" id="monthNavInfo">All months</div>
                </div>
              </div>
              <div class="card-body p-0">
                <div id="monthsStrip" class="months-strip" role="region" aria-label="All months">
                  <!-- 12 month cards injected here by script.js -->
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card events-card">
              <div class="card-header">Add Custom Event</div>
              <div class="card-body">
                <form id="addEventForm">
                  <div class="mb-3">
                    <label for="eventName" class="form-label">Event Name</label>
                    <input type="text" class="form-control" id="eventName" placeholder="Enter event name" required />
                  </div>
                  <div class="mb-3">
                    <label for="eventDate" class="form-label">Date</label>
                    <input type="date" class="form-control" id="eventDate" required />
                  </div>
                  <button type="submit" class="btn btn-primary w-100">Add Event</button>
                </form>
              </div>
            </div>

        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6VKVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
